<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="360" height="360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1a1a"/>
      <stop offset="100%" stop-color="#1a2a2a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3a8"/>
      <stop offset="100%" stop-color="#16a085"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="360" height="360" fill="url(#bg)"/>

  <!-- sutil grid de fundo -->
  <g opacity="0.05" stroke="#22d3a8" stroke-width="1">
    <line x1="0" y1="90" x2="360" y2="90"/>
    <line x1="0" y1="180" x2="360" y2="180"/>
    <line x1="0" y1="270" x2="360" y2="270"/>
    <line x1="90" y1="0" x2="90" y2="360"/>
    <line x1="180" y1="0" x2="180" y2="360"/>
    <line x1="270" y1="0" x2="270" y2="360"/>
  </g>

  <!-- halter centralizado, horizontal -->
  <g fill="url(#accent)" filter="url(#glow)" transform="translate(180 180)">
    <!-- barra central -->
    <rect x="-60" y="-8" width="120" height="16" rx="3"/>

    <!-- peso esquerdo (externo) -->
    <rect x="-110" y="-38" width="22" height="76" rx="4"/>
    <!-- peso esquerdo (interno) -->
    <rect x="-82" y="-28" width="18" height="56" rx="3"/>

    <!-- peso direito (externo) -->
    <rect x="88" y="-38" width="22" height="76" rx="4"/>
    <!-- peso direito (interno) -->
    <rect x="64" y="-28" width="18" height="56" rx="3"/>
  </g>

  <!-- linha decorativa tipo "chão" -->
  <line x1="80" y1="285" x2="280" y2="285" stroke="#22d3a8" stroke-width="2" opacity="0.3"/>

  <!-- label pequeno -->
  <text x="180" y="325" fill="#22d3a8" opacity="0.55"
        font-family="system-ui, -apple-system, sans-serif"
        font-size="12" font-weight="600" text-anchor="middle"
        letter-spacing="3">EXERCÍCIO</text>
</svg>
